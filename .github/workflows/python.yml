name: Python Applications
on:
  push:
  pull_request:
jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Run application
      run: python app.py